[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-json-editor"
dynamic = ["version"]
description = "Composant d'édition jslt réutilisable (Web Component : coloration syntaxique + intellisense)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gael Beard", email = "gaelgael5@gmail.com" }]
keywords = ["json", "transform", "template", "jslt", "editor", "web-component"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors",
    "Typing :: Typed",
]
# Le catalogue d'intellisense se construit depuis un registre urban-json.
dependencies = [
    "urban-json",
]

[project.optional-dependencies]
# mount() importe starlette à l'appel (pas une dépendance d'exécution) ; les
# tests l'exercent, donc le workflow de release doit l'installer explicitement.
test = ["starlette"]

[project.urls]
Homepage = "https://github.com/gaelgael5/Jslt"
Repository = "https://github.com/gaelgael5/Jslt"

[tool.setuptools.dynamic]
version = { attr = "urban_json_editor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urban_json_editor = ["py.typed", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
