[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jslt-csv"
dynamic = ["version"]
description = "Plugin jslt : lecture de fichiers CSV (fonction de template loadcsv)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gael Beard", email = "gaelgael5@gmail.com" }]
keywords = ["json", "transform", "template", "jslt", "csv", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "jslt",
]

[project.urls]
Homepage = "https://github.com/gaelgael5/Jslt"
Repository = "https://github.com/gaelgael5/Jslt"

# Découverte automatique par jslt : installer ce paquet suffit à exposer `loadcsv`.
[project.entry-points."jslt.functions"]
csv = "jslt_csv:register"

[tool.setuptools.dynamic]
version = { attr = "jslt_csv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jslt_csv = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
