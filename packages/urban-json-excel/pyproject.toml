[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-json-excel"
dynamic = ["version"]
description = "Plugin urban-json : lecture de classeurs Excel (loadxls, loadxlssheet)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gael Beard", email = "gaelgael5@gmail.com" }]
keywords = ["json", "transform", "template", "jslt", "excel", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]
dependencies = [
    "urban-json",
    # Classeurs .xlsx (ExcelDataReader côté .NET).
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Anciens classeurs .xls (format binaire Excel 97-2003).
xls = ["xlrd>=2.0"]

[project.urls]
Homepage = "https://github.com/gaelgael5/Jslt"
Repository = "https://github.com/gaelgael5/Jslt"

# Découverte automatique par urban-json : installer ce paquet suffit à exposer ses fonctions.
[project.entry-points."urban_json.functions"]
excel = "urban_json_excel:register"

[tool.setuptools.dynamic]
version = { attr = "urban_json_excel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urban_json_excel = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
