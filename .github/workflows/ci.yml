name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package, plugins, editor, app and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/jslt[dev]"
          pip install -e packages/jslt-csv
          pip install -e packages/jslt-xml
          pip install -e packages/jslt-db
          pip install -e packages/jslt-http
          pip install -e packages/jslt-elastic
          pip install -e packages/jslt-editor
          pip install -e "apps/playground[dev]"

      - name: Lint (ruff)
        run: ruff check packages apps

      - name: Tests — cœur (pytest)
        run: pytest -q packages/jslt/tests

      - name: Tests — plugins + composant (pytest)
        run: >-
          pytest -q packages/jslt-csv/tests packages/jslt-xml/tests
          packages/jslt-db/tests packages/jslt-http/tests packages/jslt-elastic/tests
          packages/jslt-editor/tests

      - name: Tests — apps (pytest)
        run: pytest -q apps/playground/tests
