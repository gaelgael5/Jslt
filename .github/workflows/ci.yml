name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package, plugins and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e packages/jslt-csv
          pip install -e packages/jslt-xml

      - name: Lint (ruff)
        run: ruff check src tests packages

      - name: Tests — cœur (pytest)
        run: pytest -q

      - name: Tests — plugins (pytest)
        run: pytest -q packages/jslt-csv/tests packages/jslt-xml/tests
