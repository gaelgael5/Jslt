name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the core package, plugins, editor, app and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/urban-json[dev]"
          pip install -e packages/urban-json-csv
          pip install -e packages/urban-json-xml
          pip install -e packages/urban-json-db
          pip install -e packages/urban-json-http
          pip install -e packages/urban-json-elastic
          pip install -e packages/urban-json-random
          pip install -e packages/urban-json-files
          pip install -e packages/urban-json-html
          pip install -e "packages/urban-json-excel[xls]"
          pip install -e packages/urban-json-phone
          pip install -e packages/urban-json-editor
          pip install -e "apps/playground[dev]"

      - name: Lint (ruff)
        run: ruff check packages apps

      - name: Tests — cœur (pytest)
        run: pytest -q packages/urban-json/tests

      - name: Tests — plugins + composant (pytest)
        run: >-
          pytest -q packages/urban-json-csv/tests packages/urban-json-xml/tests
          packages/urban-json-db/tests packages/urban-json-http/tests packages/urban-json-elastic/tests
          packages/urban-json-random/tests packages/urban-json-files/tests packages/urban-json-html/tests
          packages/urban-json-excel/tests packages/urban-json-phone/tests
          packages/urban-json-editor/tests

      - name: Tests — apps (pytest)
        run: pytest -q apps/playground/tests

  # Construit les 12 distributions et les valide, à chaque push et chaque PR.
  #
  # Le job `test` ci-dessus installe en *éditable* : il ne prouve rien sur ce qui
  # part réellement dans une sdist/wheel. Toute une classe de défauts n'apparaît
  # alors qu'au tag de release, trop tard : un fichier présent en local mais non
  # versionné, une entrée `package-data` oubliée (les assets `static/*.js` de
  # l'éditeur ne sont dans la wheel que par ce biais), un README que `twine check`
  # refuse, un `__version__` illisible par `[tool.setuptools.dynamic]`.
  #
  # Construire depuis le checkout — et non depuis un répertoire de travail — est
  # ce qui fait voir les fichiers non versionnés.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Outillage de build
        run: python -m pip install --upgrade pip build twine

      - name: Construire et vérifier chaque distribution
        run: |
          for d in packages/*/; do
            echo "::group::$(basename "$d")"
            python -m build "$d"
            python -m twine check "$d"dist/*
            echo "::endgroup::"
          done
