[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jslt-playground"
dynamic = ["version"]
description = "Playground web de test/démo pour jslt (FastAPI + composant jslt-editor)."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Gael Beard", email = "gaelgael5@gmail.com" }]
dependencies = [
    "jslt",
    "jslt-editor",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff==0.16.8",  # épinglé (cohérent avec packages/jslt[dev]) : CI == local
    "httpx>=0.24",
]

[tool.setuptools.dynamic]
version = { attr = "jslt_playground.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jslt_playground = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
